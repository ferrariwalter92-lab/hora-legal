<style>
.invito-corpo { align-items: flex-start; }
.invito-corpo .riga { overflow-wrap: anywhere; }
.invito-corpo #noapp { margin: 36px 0 12px; }
.invito-corpo #after { margin-top: 24px; max-width: 34ch; }
.button.store { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; margin: 0 0 10px; border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,.6); text-decoration: none; font-weight: 600; }
[data-cielo="giorno"] .button.store { border-color: rgba(14,26,58,.5); }
.button.store.soon { opacity: .85; pointer-events: none; border-style: dashed; }
</style>
<script>
    (function () {
      // Store links: fill in when Hora is on the stores.
      var APP_STORE_URL = '';
      var PLAY_STORE_URL = '';
      var ANDROID_PACKAGE = 'com.friends_hangout_app';

      var en = !/^it\b/i.test(navigator.language || 'it');
      var txt = en ? {
        title: '@{u} invites you to Hora',
        anon: "You've been invited to Hora",
        lead: 'For the evenings you didn\'t plan.',
        open: 'Open in Hora',
        noapp: "Don't have Hora yet? Get it:",
        soon: ' · coming soon',
        after: 'After signing up, open this link again and you\'ll find @{u} ready to add.'
      } : {
        title: '@{u} ti invita su Hora',
        anon: 'Ti hanno invitato su Hora',
        lead: 'Per le sere che non avevi programmato.',
        open: 'Apri in Hora',
        noapp: 'Non hai ancora Hora? Scaricala:',
        soon: ' · presto',
        after: 'Dopo la registrazione riapri questo link: troverai @{u} pronto da aggiungere.'
      };
      if (en) document.documentElement.lang = 'en';

      // Username from /a/<username> or from ?u=<username> (404.html sends here).
      function readUsername() {
        var m = location.pathname.match(/^\/a\/([^\/]+)\/?$/);
        var raw = m && m[1] !== 'index.html' ? m[1] : null;
        if (!raw) {
          var q = location.search.match(/[?&]u=([^&#]*)/);
          raw = q ? q[1] : null;
        }
        if (!raw) return null;
        try { raw = decodeURIComponent(raw); } catch (e) { return null; }
        raw = raw.replace(/^@/, '').toLowerCase();
        return /^[a-z0-9_]{3,20}$/.test(raw) ? raw : null;
      }

      var user = readUsername();
      var appLink = user ? 'hora://a/' + user : 'hora://';

      document.getElementById('title').textContent = user ? txt.title.replace('{u}', user) : txt.anon;
      document.getElementById('lead').textContent = txt.lead;
      document.getElementById('noapp').textContent = txt.noapp;
      if (user) document.getElementById('after').textContent = txt.after.replace('{u}', user);
      if (user) document.title = '@' + user + ' – HORA';

      var open = document.getElementById('open');
      open.textContent = txt.open;
      open.href = appLink;

      function store(id, url, label) {
        var a = document.getElementById(id);
        if (url) { a.href = url; a.textContent = label; a.className = 'button store'; }
        else { a.textContent = label + txt.soon; }
      }
      store('appstore', APP_STORE_URL, 'App Store');
      store('playstore', PLAY_STORE_URL, 'Google Play');

      // Try to open the app right away. Android: an intent link, which comes
      // back to this page (tried=1) if Hora isn't installed. iPhone: no
      // automatic try (Safari shows an error if the app is missing): the
      // button does it, and with Universal Links the app opens before this page.
      var isAndroid = /android/i.test(navigator.userAgent);
      var tried = /[?&]tried=1/.test(location.search);
      if (user && isAndroid && !tried) {
        var back = location.origin + '/a/?u=' + encodeURIComponent(user) + '&tried=1';
        location.replace('intent://a/' + user + '#Intent;scheme=hora;package=' + ANDROID_PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(back) + ';end');
      }
    })();
  </script>
